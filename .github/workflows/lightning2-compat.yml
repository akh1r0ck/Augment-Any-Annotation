name: Lightning 2 compatibility

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lightning2-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: src/lama/requirements.txt
      - name: Install PyTorch and compatibility-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install \
            "pytorch-lightning~=2.6.1" \
            "numpy~=1.26.0" \
            "scipy~=1.13.0" \
            "scikit-image~=0.24.0" \
            "scikit-learn==1.5.0" \
            "opencv-python-headless~=4.10.0" \
            "hydra-core~=1.3.2" \
            "albumentations==0.5.2" \
            "kornia==0.5.0" \
            easydict pandas matplotlib webdataset
      - name: Run Lightning 2 compatibility tests
        env:
          MPLCONFIGDIR: /tmp/matplotlib
          PYTHONPATH: src/lama
          TORCH_HOME: /tmp/torch-home
        run: python -m unittest tests/test_lightning2_compat.py -v
